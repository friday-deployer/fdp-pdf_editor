[package]
name = "folioxide-fuzz"
description = "cargo-fuzz targets for Folioxide (nightly only; not part of the workspace)"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
folioxide-syntax = { path = "../crates/folioxide-syntax" }
# fuzz_cms_parse and fuzz_verify (M3 WP3.3A).
folioxide-model = { path = "../crates/folioxide-model" }
folioxide-sign = { path = "../crates/folioxide-sign" }
# `exercise` (open, resolve, decode, page count) for fuzz_parse_document. Test support only.
folioxide-testkit = { path = "../crates/folioxide-testkit" }
# fuzz_jpeg_header (M4 WP4.1A).
folioxide-content = { path = "../crates/folioxide-content" }

# An empty workspace table keeps this crate out of the root workspace (which also lists it under
# `exclude`), so `cargo test --workspace` never needs nightly or libFuzzer.
[workspace]

[[bin]]
name = "fuzz_lexer"
path = "fuzz_targets/fuzz_lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_filters"
path = "fuzz_targets/fuzz_filters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_document"
path = "fuzz_targets/fuzz_parse_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_document_default_limits"
path = "fuzz_targets/fuzz_parse_document_default_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cms_parse"
path = "fuzz_targets/fuzz_cms_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_verify"
path = "fuzz_targets/fuzz_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_jpeg_header"
path = "fuzz_targets/fuzz_jpeg_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_tsp_parse"
path = "fuzz_targets/fuzz_tsp_parse.rs"
test = false
doc = false
bench = false
