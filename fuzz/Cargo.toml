[package]
name = "folioxide-fuzz"
description = "cargo-fuzz targets for Folioxide (nightly only; not part of the workspace)"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
folioxide-syntax = { path = "../crates/folioxide-syntax" }

# An empty workspace table keeps this crate out of the root workspace (which also lists it under
# `exclude`), so `cargo test --workspace` never needs nightly or libFuzzer.
[workspace]

[[bin]]
name = "fuzz_smoke"
path = "fuzz_targets/fuzz_smoke.rs"
test = false
doc = false
bench = false
