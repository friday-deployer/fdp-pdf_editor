[package]
name = "folioxide-node"
description = "Node.js binding (napi-rs) for the Folioxide PDF engine; published to npm as `folioxide`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
folioxide.workspace = true
napi.workspace = true
napi-derive.workspace = true
# Wipes the binding's copies of passwords and PEM keys (M3 fix r1).
zeroize.workspace = true

[build-dependencies]
napi-build.workspace = true

[dev-dependencies]
# The unit tests check that the binding's DTOs have the JSON shape of the core's serde DTOs
# (ARCHITECTURE §A.7, §A.8: Node and Tauri see the same JSON).
folioxide = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true

# Same as [workspace.lints] except `unsafe_code`, which is `deny` instead of `forbid`: the
# `#[napi]` macros expand to `unsafe` FFI glue wrapped in `#[allow(unsafe_code)]`, and `forbid`
# cannot be overridden by an inner `allow`. `deny` still rejects any hand-written `unsafe` here.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
