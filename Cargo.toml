[workspace]
resolver = "3"
members = ["crates/*", "bindings/node", "xtask"]
# The cargo-fuzz crate has its own (empty) [workspace] table and is built with nightly only.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV for every crate (DECISIONS D5.1 as revised by D7.2).
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/friday-deployer/fdp-pdf_editor"

# Every dependency version is pinned here (ARCHITECTURE §A.5). Members use `{ workspace = true }`.
[workspace.dependencies]
# Internal crates. Sub-crates carry no default features; the facade decides what is enabled.
folioxide = { path = "crates/folioxide", version = "0.1.0" }
folioxide-syntax = { path = "crates/folioxide-syntax", version = "0.1.0", default-features = false }
folioxide-security = { path = "crates/folioxide-security", version = "0.1.0", default-features = false }
folioxide-model = { path = "crates/folioxide-model", version = "0.1.0", default-features = false }
folioxide-content = { path = "crates/folioxide-content", version = "0.1.0", default-features = false }
folioxide-interactive = { path = "crates/folioxide-interactive", version = "0.1.0", default-features = false }
folioxide-sign = { path = "crates/folioxide-sign", version = "0.1.0", default-features = false }
folioxide-redact = { path = "crates/folioxide-redact", version = "0.1.0", default-features = false }
folioxide-render = { path = "crates/folioxide-render", version = "0.1.0", default-features = false }
folioxide-testkit = { path = "crates/folioxide-testkit", version = "0.1.0", default-features = false }

# folioxide-syntax object model and errors (M1 WP1.1, ARCHITECTURE §A.5).
indexmap = { version = "2.14.2", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
# JSON for the tests of the serde DTOs (M2 WP2.3). Dev-dependency only.
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

# RustCrypto 2026 stack (M0 dependency spike, ARCHITECTURE §A.5 "Gaps" 2 and 5).
# `rsa` and `cms` are pre-releases and pinned exactly: `pkcs12 0.2.0-pre.0` (via p12-keystore)
# requires `cms = "=0.3.0-pre.1"`, so the whole graph must agree on that version.
rsa = { version = "=0.10.0-rc.19", default-features = false, features = ["std", "encoding"] }
cms = { version = "=0.3.0-pre.1", default-features = false }
p12-keystore = { version = "0.4.0", default-features = false }
x509-cert = { version = "0.3.0", default-features = false, features = ["pem"] }
der = { version = "0.8.2", default-features = false, features = ["derive", "oid", "alloc", "pem"] }

# Node-API (bindings/node only; never a dependency of a core crate, see ARCHITECTURE §A.8).
# `dyn-symbols` is a napi default that we keep on purpose (§A.7 shows only "napi8"; proposed
# decision in the M0 WP0.1 report). With it, napi-sys looks the `napi_*` functions up in the host
# process when the addon loads instead of declaring them as `extern` symbols, so the addon has no
# undefined Node-API symbols and every binary that links napi code (the cdylib, and any Rust unit
# test of folioxide-node) links on Linux and macOS without a Node host. It is also the
# configuration napi-rs ships and tests by default. Windows MSVC builds use this lookup either way.
napi ={ version = "3.14.2", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = { version = "3.6.12" }
napi-build = { version = "2.6.0" }

# Syntax layer: stream filters (M1 WP1.2, ARCHITECTURE §A.5). `miniz_oxide` does both the lenient
# partial inflate and the deflate encoder, so `flate2` is not needed; LZW is our own implementation.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

# Property tests (M1 WP1.4, ARCHITECTURE §A.9 layer 3). Dev-dependency only. `std` without the
# default `fork`/`timeout` features, which pull in rusty-fork and tempfile.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

# Signatures (M3 WP3.0, brief §2 stage 0; ARCHITECTURE §A.5). The rest of the RustCrypto 2026
# stack: every crate below is on `digest` 0.11, `der` 0.8, `spki` 0.8 and `rand_core` 0.10, so it
# shares one graph with the M0 pins above (`cargo tree -i cms` stays single). All are MIT OR
# Apache-2.0 and need Rust <= 1.87. None of their types appears in a public signature (gap 5).
# `oid` gives `AssociatedOid`, which `rsa::pkcs1v15::{SigningKey, VerifyingKey}<D>` require.
sha2 = { version = "0.11.0", default-features = false, features = ["oid"] }
# SHA-1 verifies legacy signatures only; Folioxide never signs with it.
sha1 = { version = "0.11.0", default-features = false, features = ["oid"] }
# `ecdsa` = RFC 6979 signing and prehash verification; `pkcs8` = PKCS#8 and SEC1 key decoding.
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
# `algorithm` = sign and verify; `der` = ECDSA-Sig-Value encoding (DER <-> IEEE P1363).
ecdsa = { version = "0.17.0", default-features = false, features = ["algorithm", "der", "pkcs8"] }
# `rand_core` = `RandomizedSigner`, the blinded RSA signing path (brief R-9).
signature = { version = "3.0.0", default-features = false, features = ["alloc", "rand_core"] }
# `encryption` = PBES2 `EncryptedPrivateKeyInfo::decrypt` (BEGIN ENCRYPTED PRIVATE KEY).
pkcs8 = { version = "0.11.0", default-features = false, features = ["encryption", "pem"] }
# SEC1 `ECPrivateKey` (BEGIN EC PRIVATE KEY).
sec1 = { version = "0.8.1", default-features = false, features = ["der", "pem"] }
spki = { version = "0.8.1", default-features = false, features = ["alloc"] }
const-oid = { version = "0.10.2", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
# `sys_rng` = `SysRng`, the default RNG for RSA blinding (brief D-1 / DECISIONS D10). wasm will
# also need `wasm_js`.
getrandom = { version = "0.4.3", default-features = false, features = ["sys_rng"] }
# `Zeroizing` buffers for decrypted key material. Resolves to 1.9.1, already in the graph.
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

# Standard security handler (M5 brief §1.9; ARCHITECTURE §A.5). All are pure Rust, permissive, on
# the same `cipher` 0.5 / `digest` 0.11 graph as the signing stack, and never in a public signature.
# AES block cipher with our own CBC loop (no `cbc` crate), RC4 for R2-R4 (reads; writes need
# `allow_weak_crypto`), MD5 for Algorithms 1-7, HMAC for the synthetic IVs, SASLprep for R6.
aes = { version = "0.9.3", default-features = false, features = ["zeroize"] }
rc4 = { version = "0.2.0", default-features = false, features = ["zeroize"] }
md-5 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
hmac = { version = "0.13.0", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6.1", default-features = false }
stringprep = { version = "0.1.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Library code must never panic on untrusted input (CLAUDE.md). CI runs clippy with `-D warnings`;
# `clippy.toml` relaxes these four inside tests.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

[profile.dev]
# Line tables are enough for backtraces, and full debug info made each worktree's target/ several
# GB (M2: the disk filled up during QA). Tests inherit this profile.
debug = "line-tables-only"

[profile.release]
# Smaller, faster Node addon builds (`pnpm build` uses the release profile).
lto = true
strip = "symbols"
