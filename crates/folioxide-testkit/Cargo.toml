[package]
name = "folioxide-testkit"
description = "Folioxide test support: byte-level PDF builder, fixture generators, test PKI and oracle output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Tests write `<oracle dir>/<suite>/<name>.pdf` plus `<name>.expect.json` for `cargo xtask oracle`.
emit = []

[dependencies]
folioxide-syntax.workspace = true
# The mock TSA's ESS certHash and message-digest (M4 brief §1, §3.4; DECISIONS D13 D-21).
sha2.workspace = true
# The mock TSA's ESS signing-certificate v1 certHash (RFC 2634), for `tst_ess_v1_accepted`.
sha1.workspace = true

[lints]
workspace = true
