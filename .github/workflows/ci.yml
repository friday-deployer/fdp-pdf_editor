# Gate commands from CLAUDE.md ("Definition of Done"), one job each.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # licenses, bans, sources and advisories, configured by deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  deps:
    name: dependency invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # ARCHITECTURE §A.8: no core crate depends on napi or tauri.
      - name: The folioxide crate has no napi or tauri dependency
        run: |
          if cargo tree --locked -p folioxide -e normal | grep -E 'napi|tauri'; then
            echo "::error::folioxide depends on napi or tauri (see docs/ARCHITECTURE.md §A.8)"
            exit 1
          fi
      # ARCHITECTURE §A.5 gap 2: exactly one `cms` version in the graph (`cargo tree -i` fails
      # when the spec is ambiguous).
      - name: Exactly one cms version
        run: |
          versions="$(cargo tree --locked -i cms --workspace --depth 0 --prefix none | sort -u)"
          echo "$versions"
          if [ "$(printf '%s\n' "$versions" | grep -c '^cms v')" -ne 1 ]; then
            echo "::error::expected exactly one cms version"
            exit 1
          fi

  node:
    name: node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The pnpm version comes from "packageManager" in bindings/node/package.json.
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: bindings/node/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bindings/node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generated binding files are up to date
        run: git diff --exit-code -- binding.js binding.d.ts
      - run: pnpm test
      - run: pnpm test:types

  oracle:
    name: oracle
    # Pinned: the oracles parse human-readable poppler/OpenSSL output, which can change between images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install poppler-utils (pdfinfo, pdfsig, pdftotext)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdfinfo -v
          openssl version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Create the oracle venv
        run: bash tools/setup-venv.sh
      - name: Every workflow file parses
        run: >-
          .venv/bin/python -I -c "import sys, yaml;
          [yaml.safe_load(open(p, encoding='utf-8')) for p in sys.argv[1:]];
          print(len(sys.argv) - 1, 'workflow files parse')" .github/workflows/*.yml
      - name: The committed test PKI is valid
        run: bash tools/gen-pki.sh --check
      - name: Oracle self-tests
        run: .venv/bin/python -I -m unittest discover -s tools/oracles/tests -v
      - name: Oracle suites
        run: cargo xtask oracle

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml for every rustup proxy, rust-cache's included.
      RUSTUP_TOOLCHAIN: "1.89"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # Core crates only: bindings/node needs a newer compiler (its own rust-version), and xtask
      # and folioxide-testkit are dev tools (DECISIONS D5.1).
      - name: cargo +1.89 check (core crates)
        run: >-
          cargo +1.89 check --locked
          -p folioxide
          -p folioxide-syntax
          -p folioxide-security
          -p folioxide-model
          -p folioxide-content
          -p folioxide-interactive
          -p folioxide-sign
          -p folioxide-redact
          -p folioxide-render
